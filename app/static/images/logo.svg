<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cellFade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#5aa6ff"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="128" height="128" rx="24" fill="#f7f8fa"/>

  <!-- 4x4 grid of availability cells, opacity encodes "heat" -->
  <g>
    <!-- row 1 -->
    <rect x="20" y="20" width="18" height="18" rx="4" fill="#0d6efd" opacity="0.15"/>
    <rect x="42" y="20" width="18" height="18" rx="4" fill="#0d6efd" opacity="0.30"/>
    <rect x="64" y="20" width="18" height="18" rx="4" fill="#0d6efd" opacity="0.55"/>
    <rect x="86" y="20" width="18" height="18" rx="4" fill="#0d6efd" opacity="0.30"/>

    <!-- row 2 -->
    <rect x="20" y="42" width="18" height="18" rx="4" fill="#0d6efd" opacity="0.30"/>
    <rect x="42" y="42" width="18" height="18" rx="4" fill="#0d6efd" opacity="0.55"/>
    <rect x="64" y="42" width="18" height="18" rx="4" fill="url(#cellFade)" opacity="1"/>
    <rect x="86" y="42" width="18" height="18" rx="4" fill="#0d6efd" opacity="0.55"/>

    <!-- row 3 -->
    <rect x="20" y="64" width="18" height="18" rx="4" fill="#0d6efd" opacity="0.55"/>
    <rect x="42" y="64" width="18" height="18" rx="4" fill="url(#cellFade)" opacity="1"/>
    <rect x="64" y="64" width="18" height="18" rx="4" fill="url(#cellFade)" opacity="1"/>
    <rect x="86" y="64" width="18" height="18" rx="4" fill="#0d6efd" opacity="0.30"/>

    <!-- row 4 -->
    <rect x="20" y="86" width="18" height="18" rx="4" fill="#0d6efd" opacity="0.15"/>
    <rect x="42" y="86" width="18" height="18" rx="4" fill="#0d6efd" opacity="0.30"/>
    <rect x="64" y="86" width="18" height="18" rx="4" fill="#0d6efd" opacity="0.30"/>
    <rect x="86" y="86" width="18" height="18" rx="4" fill="#0d6efd" opacity="0.15"/>
  </g>
</svg>
